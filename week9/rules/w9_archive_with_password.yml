title: Archiver Creates Password-Protected Archive
id: 4f6c1f8e-0d1b-4c2a-9b1e-6a1b2c3d9007
status: experimental
description: 7-Zip / RAR invoked with a -p password switch, typical of staging data for exfiltration (Atomic T1560.001 #4).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: Danial Rahman (CS-2421)
date: 2026/11/09
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\rar.exe'
      - '\WinRAR.exe'
  selection_pw:
    CommandLine|contains: ' -p'
  condition: selection_img and selection_pw
falsepositives:
  - Backup jobs that encrypt archives; allowlist by user and destination
level: medium
tags:
  - attack.collection
  - attack.t1560.001
