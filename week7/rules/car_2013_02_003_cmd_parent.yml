title: Command Shell Spawned by Office or Mail Application (CAR-2013-02-003 tuned)
id: cffd8aeb-2141-4c52-9b16-d9080b7cb572
status: experimental
description: >
  Week 7 implementation of MITRE CAR-2013-02-003 "Processes Spawning cmd.exe".
  The CAR analytic flags abnormal parents of cmd.exe; CAR explicitly names
  document and mail readers as the suspicious case. This rule keeps cmd.exe
  launched by an Office or mail/reader process, which is the second
  user-execution path in the group's phishing scenario (Office -> cmd ->
  PowerShell), covering T1059.003 alongside the primary T1059.001 chain.
references:
  - https://car.mitre.org/analytics/CAR-2013-02-003/
  - https://attack.mitre.org/techniques/T1059/003/
author: Week 7 group project (Detecting Spearphishing Attacks)
date: 2026/10/24
logsource:
  product: windows
  category: process_creation
detection:
  selection_cmd:
    Image|endswith: '\cmd.exe'
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
      - '\Acrobat.exe'
      - '\AcroRd32.exe'
  condition: selection_cmd and selection_parent
falsepositives:
  - Document templates or add-ins that legitimately shell out (uncommon; verify)
level: high
tags:
  - attack.execution
  - attack.t1059.003
  - attack.t1204.002
  - car.2013-02-003
